# Durable processing tick: calls GET /cron/process on the production site (see docs/deployment.md#scheduler-github-actions).
# The endpoint is idempotent and safe under overlap; this workflow only triggers it.
name: Process cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: process-cron
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /cron/process
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then echo "::error::Repository variable APP_URL is not set."; exit 1; fi
          if [ -z "${CRON_SECRET:-}" ]; then echo "::error::Repository secret CRON_SECRET is not set."; exit 1; fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL must start with https://."; exit 1 ;;
          esac
          # The header is read from stdin so the secret never appears in the process arguments.
          printf 'Authorization: Bearer %s\n' "$CRON_SECRET" | curl --silent --show-error --fail-with-body \
            --proto '=https' --connect-timeout 10 --max-time 90 \
            --request GET --header @- "${APP_URL%/}/cron/process"
          echo
